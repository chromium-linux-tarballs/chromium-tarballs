name: Chromium Version Tagging

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [tag-chromium-versions]

jobs:
  tag_chromium_versions:
    runs-on: ubuntu-slim
    env:
      CHANNEL_PLATFORM_LIST: stable=linux beta=linux dev=linux extended=win lts=chromeos ltc=chromeos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # If we use the default github.token we can't trigger workflows when we push new tags
          token: ${{ secrets.PAT || github.token }}
          # If we don't set fetch-depth to 0, we won't be able to fetch tags
          fetch-depth: 0

      - name: Get Chromium release info
        run: |
          starttime=$(date -Isec -d '7 days ago' -u | sed 's/+.*/Z/')
          curl --fail-with-body --max-time 30 --no-progress-meter -o releases.json \
            "https://versionhistory.googleapis.com/v1/chrome/platforms/all/channels/all/versions/all/releases?filter=starttime%3E=$starttime&order_by=version%20desc"
          for cp in $CHANNEL_PLATFORM_LIST; do
              channel=${cp%=*}; platform=${cp#*=}
              echo "Latest version(s) in the \"$channel\" channel:"
              jq -r --arg PLATFORM "${platform}" --arg CHANNEL "${channel}" \
                'limit(10; .releases[]
                 | select(.name | test("/platforms/\($PLATFORM)/channels/\($CHANNEL)/"))
                 | "  " + .version)
                ' releases.json
              echo " "
          done

      - name: Configure Git
        run: |
          git config --global user.name "Chromium Bot"
          git config --global user.email "chromium@gentoo.org"

      - name: Tag new versions
        id: tag_versions
        run: |
          exec 2>&1
          new_releases=""
          for cp in $CHANNEL_PLATFORM_LIST; do
              channel=${cp%=*}; platform=${cp#*=}
              version=$(jq -r --arg PLATFORM "${platform}" --arg CHANNEL "${channel}" \
                'limit(1; .releases[] | select(.name | test("/platforms/\($PLATFORM)/channels/\($CHANNEL)/")) | .version)' \
                releases.json)
              test -n "${version}" || continue
              if ! echo "${version}" | tr '\n' '~' | grep -Pq '^(\d{1,4}\.){3}\d{1,4}~$'; then
                  echo "Error: Platform \"${platform}\" channel \"${channel}\" has invalid version \"${version}\""
                  exit 1
              fi
              echo "Channel \"${channel}\" is at version ${version}"
              if git rev-parse "${version}" >/dev/null 2>&1; then
                  echo "Tag ${version} already exists"
                  continue
              fi
              _ver=$(jq -r --arg PLATFORM "${platform}" --arg CHANNEL "${channel}" --arg VERSION "${version}" \
                'limit(1; .releases[]
                 | select(.version==$VERSION)
                 | select(.name | test("/platforms/\($PLATFORM)/channels/\($CHANNEL)/"))
                 | "Chromium \(.version): \($CHANNEL) "
                   + (.serving.startTime
                      | sub("\\.\\d+"; "")
                      | fromdateiso8601
                      | strftime("(%B %d, %Y at %I:%M UTC)")) )
                ' releases.json)
              echo "Tagging ${_ver}"
              git tag -a "${version}" -m "${_ver}"
              if [ -n "$new_releases" ]; then
                  new_releases="${new_releases} | ${_ver}"
              else
                  new_releases="${_ver}"
              fi
          done
          echo " "
          echo "Pushing tags to GitHub"
          (set -x; git push --follow-tags)

          # Export new releases for IRC notification
          echo "new_releases=$new_releases" >> "$GITHUB_OUTPUT"

      - name: Update IRC
        uses: Gottox/irc-message-action@5ab60c2121053c99a383753390fb169a0045694d # v2.1.5
        if: steps.tag_versions.outputs.new_releases != '' && github.repository == 'chromium-linux-tarballs/chromium-tarballs'
        continue-on-error: true
        with:
          server: irc.libera.chat
          notice: false
          channel: "#gentoo-chromium"
          nickname: chromium-notifs
          message: "🏷️ New release: ${{ steps.tag_versions.outputs.new_releases }}"
